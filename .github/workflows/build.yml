name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/headphonepopup
          
          if ! grep -q "^package " MainActivity.kt; then
            sed -i '1s/^/package com.example.headphonepopup\n\n/' MainActivity.kt
          fi
          
          cp MainActivity.kt app/src/main/java/com/example/headphonepopup/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HeadphonePopup"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.4.0'
              id 'org.jetbrains.kotlin.android' version '1.9.24'
          }

          android {
              namespace 'com.example.headphonepopup'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.headphonepopup"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadphonePopup-APK
          path: app/build/outputs/apk/debug/app-debug.apk
